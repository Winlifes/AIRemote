plugins { id 'com.android.application' }

def appVersion = file('../../VERSION').text.trim()
def parts = appVersion.tokenize('.').collect { it as int }
def signingPath = System.getenv('AIREMOTE_KEYSTORE')
def signingPassword = System.getenv('AIREMOTE_KEYSTORE_PASSWORD')
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && (!signingPath || !signingPassword)) {
    throw new GradleException('Release builds need AIREMOTE_KEYSTORE and AIREMOTE_KEYSTORE_PASSWORD; use assembleDebug for local development.')
}
android {
    namespace 'fun.winlife.airemote'
    compileSdk 35
    defaultConfig {
        applicationId 'fun.winlife.airemote'
        minSdk 26
        targetSdk 35
        versionCode parts[0] * 1000000 + parts[1] * 1000 + parts[2]
        versionName appVersion
        buildConfigField 'String', 'RELEASE_REPO', '"Winlifes/AIRemote"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (signingPath) storeFile file(signingPath)
            storePassword signingPassword
            keyAlias System.getenv('AIREMOTE_KEY_ALIAS') ?: 'airemote'
            keyPassword System.getenv('AIREMOTE_KEY_PASSWORD') ?: signingPassword
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18'
}
