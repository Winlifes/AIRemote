name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-and-connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 tools/check_publication.py
      - run: |
          python3 -m unittest discover -s poc -p 'test_*.py' -q
          python3 -m unittest discover -s relay -p 'test_*.py' -q
          python3 -m unittest discover -s deploy -p 'test_*.py' -q
      - run: npm ci && npm test && npm run build
        working-directory: web
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/flutter
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze && flutter test
      - run: flutter test test_live/github_update_test.dart
      - run: flutter build apk --debug
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios-and-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/flutter
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --no-codesign
      - run: python3 macos/test_update_progress.py
      - run: python3 macos/build_app.py --zip dist/AIRemote-macos.zip
