name: Publish signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 tools/check_publication.py
      - run: |
          python3 -m unittest discover -s poc -p 'test_*.py' -q
          python3 -m unittest discover -s relay -p 'test_*.py' -q
          python3 -m unittest discover -s deploy -p 'test_*.py' -q
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: python3 tools/package_server.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-release
          path: dist/AIRemote-server.tar.gz
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: ./.github/actions/flutter
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze && flutter test
      - name: Restore private signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'airemote-release.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          key.chmod(0o600)
          PY
      - name: Test and build signed APK
        env:
          AIREMOTE_KEYSTORE: ${{ runner.temp }}/airemote-release.jks
          AIREMOTE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AIREMOTE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AIREMOTE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          cd android
          # AGP exposes the app's default unit-test suite on the debug variant.
          # Keep release lint and the separately built, signed release APK.
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease
      - name: Verify APK signature and metadata
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/AIRemote-android.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/AIRemote-android.apk > dist/ANDROID-SIGNING.txt
          cat dist/ANDROID-SIGNING.txt
          grep -q 'e275f135d90f65dc89a378cf5e91f25c1a9abc6dd0aa5299d5deadb42a539988' dist/ANDROID-SIGNING.txt
          python3 - <<'PYAPK'
          import zipfile
          with zipfile.ZipFile('dist/AIRemote-android.apk') as apk:
              names = apk.namelist()
              assert any(name.endswith('/libflutter.so') for name in names), 'Missing Flutter engine'
              assert any('/flutter_assets/' in name for name in names), 'Missing native Flutter UI bundle'
          PYAPK
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/AIRemote-android.apk | head -5
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/airemote-release.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: |
            dist/AIRemote-android.apk
            dist/ANDROID-SIGNING.txt
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: python3 macos/test_update_progress.py
      - run: python3 macos/build_app.py --zip dist/AIRemote-macos.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release
          path: dist/AIRemote-macos.zip
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/flutter
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --no-codesign
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: if ((Get-Content VERSION -Raw).Trim().Insert(0,'v') -ne $env:GITHUB_REF_NAME) { throw 'Invalid release tag' }
      - run: python -m unittest discover -s windows -p 'test_*.py' -q
      - run: python tools/package_windows.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: dist/AIRemote-windows.zip
  publish:
    needs: [server, android, macos, ios, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-release'
          merge-multiple: true
          path: dist
      - name: Publish complete release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum AIRemote-android.apk AIRemote-macos.zip AIRemote-windows.zip AIRemote-server.tar.gz ANDROID-SIGNING.txt > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          ## 手机端对话页

          - 标题、项目和运行状态收进紧凑的顶部栏。文件可以一键打开，刷新和目标管理可从「对话选项」进入。
          - 同一轮的进度消息收进「执行过程」，点开可以查看原文。回复底部显示处理时长。
          - 向上翻历史时保留阅读位置。有新回复或已有回复更新时，可以点击「有更新 · 回到最新」查看。
          - 代码块支持横向滑动和单独复制。旧指令可放回输入框，已有草稿会保留。
          - App 和手机网页使用相同的对话操作。短对话从顶部开始，长对话打开时定位到最新消息。

          ## 安装与升级

          - Android 下载 **AIRemote-android.apk**。APK 沿用正式发布签名，可以覆盖安装。
          - Mac 和 Windows 下载对应的压缩包。安装与自托管服务端升级说明见仓库的 README。
          - **SHA256SUMS** 可校验各下载文件，**ANDROID-SIGNING.txt** 记录 APK 签名验证结果。
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "AIRemote $GITHUB_REF_NAME" --notes-file release-notes.md AIRemote-android.apk AIRemote-macos.zip AIRemote-windows.zip AIRemote-server.tar.gz ANDROID-SIGNING.txt SHA256SUMS
