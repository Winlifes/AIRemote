name: Publish signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 tools/check_publication.py
      - run: |
          python3 -m unittest discover -s poc -p 'test_*.py' -q
          python3 -m unittest discover -s relay -p 'test_*.py' -q
          python3 -m unittest discover -s deploy -p 'test_*.py' -q
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: python3 tools/package_server.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-release
          path: dist/AIRemote-server.tar.gz
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Restore private signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'airemote-release.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          key.chmod(0o600)
          PY
      - name: Test and build signed APK
        working-directory: android
        env:
          AIREMOTE_KEYSTORE: ${{ runner.temp }}/airemote-release.jks
          AIREMOTE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AIREMOTE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AIREMOTE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Verify APK signature and metadata
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/AIRemote-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/AIRemote-android.apk > dist/ANDROID-SIGNING.txt
          cat dist/ANDROID-SIGNING.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/AIRemote-android.apk | head -5
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/airemote-release.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: |
            dist/AIRemote-android.apk
            dist/ANDROID-SIGNING.txt
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: python3 macos/build_app.py --zip dist/AIRemote-macos.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release
          path: dist/AIRemote-macos.zip
  publish:
    needs: [server, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-release'
          merge-multiple: true
          path: dist
      - name: Publish complete release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum AIRemote-android.apk AIRemote-macos.zip AIRemote-server.tar.gz ANDROID-SIGNING.txt > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          手机继续 Mac Codex / DeepSeek Harness 现有对话，支持消息、状态、文件、原生指令队列与新建对话。

          - Android：安装 AIRemote-android.apk（Android 8+），首次填写自己的 HTTPS 中继地址。使用长期发布签名，支持 GitHub 更新检查、校验和系统确认安装。
          - Mac：解压 AIRemote-macos.zip，将应用放入 /Applications 或 ~/Applications。Intel / Apple Silicon 通用；支持 GitHub 更新并保留私有配置。此构建采用 ad-hoc 签名，尚未经过 Apple 公证。
          - 自托管服务端：AIRemote-server.tar.gz，包含构建好的网页。可选启用六小时稳定版自动更新，健康检查失败会回退。

          安装、配置、签名密钥与自动发布说明见仓库 README。SHA256SUMS 为下载校验，ANDROID-SIGNING.txt 为 APK 签名验证结果。安装包不包含个人账号、服务器凭据或聊天记录。
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "AIRemote $GITHUB_REF_NAME" --notes-file release-notes.md AIRemote-android.apk AIRemote-macos.zip AIRemote-server.tar.gz ANDROID-SIGNING.txt SHA256SUMS
